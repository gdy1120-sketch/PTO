<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027 달력</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#172b31;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:28px 14px}.wrap{max-width:650px;margin:auto;background:white;padding:clamp(16px,5vw,35px);border-radius:20px;box-shadow:0 8px 32px #1d354514}h1{margin:0;font-size:1.25rem}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}.year{color:#64748b;font-size:.85rem}h2{font-size:1.8rem;text-align:center;margin:0 0 24px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;font-weight:700;color:#64748b;padding:10px 0}.weekday:first-child{color:#d04b4b}.day{min-height:clamp(45px,11vw,70px);display:grid;place-items:center;border-radius:10px;font-size:1.1rem;font-weight:650}.available{background:#c9efd6;color:#175a34}.blocked{background:#f6b8b8;color:#852323}.empty{background:transparent}.legend{display:flex;gap:20px;justify-content:center;margin:24px 0}.legend span{display:flex;align-items:center;gap:7px;font-size:.9rem}.dot{width:14px;height:14px;border-radius:4px;display:inline-block}.controls{display:flex;gap:12px}.controls button{flex:1;border:0;border-radius:10px;background:#183d50;color:white;padding:15px;font-weight:700;font-size:1rem;cursor:pointer}.controls button:disabled{opacity:.3;cursor:not-allowed}.status{min-height:24px;text-align:center;color:#9b3030;font-size:.9rem;margin-top:14px}@media(max-width:400px){.calendar{gap:4px}.day{font-size:.95rem;border-radius:7px}}
</style>
</head>
<body><main class="wrap"><header><h1>날짜 현황 달력</h1><span class="year">2027년</span></header><h2 id="month" aria-live="polite"></h2><section id="calendar" class="calendar" aria-label="월별 달력"></section><div class="legend"><span><i class="dot" style="background:#c9efd6"></i>일반 날짜</span><span><i class="dot" style="background:#f6b8b8"></i>지정 날짜</span></div><nav class="controls"><button id="prev">← 이전 달</button><button id="next">다음 달 →</button></nav><div class="status" id="status" role="status"></div></main>
<script>
const YEAR=2027;let month=0;let dates=new Set(),ranges=[];
const pad=n=>String(n).padStart(2,'0');
const valid=s=>{if(typeof s!=='string'||!/^2027-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d};
const blocked=s=>dates.has(s)||ranges.some(r=>s>=r.start&&s<=r.end);
function render(){document.getElementById('month').textContent=`${YEAR}년 ${month+1}월`;const el=document.getElementById('calendar');el.replaceChildren();['일','월','화','수','목','금','토'].forEach(w=>{const d=document.createElement('div');d.className='weekday';d.textContent=w;el.append(d)});const offset=new Date(YEAR,month,1).getDay(),total=new Date(YEAR,month+1,0).getDate();for(let i=0;i<offset;i++){const d=document.createElement('div');d.className='empty';el.append(d)}for(let d=1;d<=total;d++){const date=`${YEAR}-${pad(month+1)}-${pad(d)}`;const b=blocked(date),cell=document.createElement('div');cell.className=`day ${b?'blocked':'available'}`;cell.textContent=d;cell.setAttribute('aria-label',`${date} ${b?'지정 날짜':'일반 날짜'}`);el.append(cell)}document.getElementById('prev').disabled=month===0;document.getElementById('next').disabled=month===11}
document.getElementById('prev').onclick=()=>{if(month>0){month--;render()}};document.getElementById('next').onclick=()=>{if(month<11){month++;render()}};
render();fetch('./dates.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data.dates)||!Array.isArray(data.ranges))throw Error('JSON 형식 오류');dates=new Set(data.dates.filter(valid));ranges=data.ranges.filter(r=>r&&valid(r.start)&&valid(r.end)&&r.start<=r.end);render()}).catch(e=>{document.getElementById('status').textContent='날짜 데이터를 불러오지 못했습니다. dates.json 파일을 확인하세요. ('+e.message+')'});
</script></body></html>
